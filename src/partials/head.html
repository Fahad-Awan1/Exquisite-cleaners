<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b1a33">
    <meta name="format-detection" content="telephone=no">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta property="og:site_name" content="Exquisite Cleaners">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/images/og-image.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Fonts are served from the site itself (see scripts/fetch-fonts.mjs); the two used at the top
         of every page start downloading straight away. -->
    <link rel="preload" href="/fonts/cormorant-garamond-normal-latin-4.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/montserrat-normal-latin-8.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/src/css/fonts.css">
    <style>
      /* First-paint styles so a page never flashes unstyled while the stylesheet loads */
      /* :where() keeps these at zero specificity, so the real stylesheet always wins once loaded */
      :where(html, body) { background: #0b1a33; color: #e8ecf4; margin: 0; }
      :where(.preloader) { position: fixed; inset: 0; z-index: 900; background: #071226; }
      :where(.wipe) { position: fixed; inset: 0; z-index: 850; pointer-events: none; }
      :where(html.returning .wipe__panel) { position: absolute; inset: 0; background: #071226; }
      :where(html.returning .preloader) { display: none; }
      :where(.preloader, .wipe) :where(svg, img) { width: 84px; height: 84px; }
      :where(.drawer, .chat__panel) { visibility: hidden; }
      :where(.cursor) { opacity: 0; }
      :where(.skip-link) { position: fixed; top: -60px; }
    </style>
    <link rel="stylesheet" href="/src/css/main.css">
    <script>
      document.documentElement.classList.add('js');
      try { if (sessionStorage.getItem('ec-visited')) document.documentElement.classList.add('returning'); } catch (e) {}
    </script>
    <script type="module" src="/src/js/main.js"></script>
